<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Tracker</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%232457D6%22 stroke=%22white%22 stroke-width=%224%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F2;--ink:#1B1D1F;--ink2:#3C4043;--muted:#5F6368;--faint:#80868B;--note:#A3A8AD;--line:#D5D8DB;--line2:#E8EAED;--card:#FFFFFF;
  --blue:#2457D6;--hl:#EEF3FF;--green:#2BA84A;--green2:#6DD38B;--green-ink:#1E7B37;--yellow:#E8A600;--fyellow:#FBE7A1;--yline:#D9B940;
  --grey:#BDC1C6;--grey2:#DADCE0;--red:#D93025;--red-ink:#B3261E;--red-bg:#FDF1EF;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:var(--ink)}a:hover{color:var(--blue)}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:900px){.ph{display:none!important}}
@media (max-width:899px){.dk{display:none!important}}

/* ---------- header ---------- */
.hdr{max-width:1200px;margin:0 auto;padding:22px 40px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:baseline;gap:12px;font-family:'Archivo',sans-serif;text-decoration:none}
.wm{font-weight:900;font-stretch:68%;line-height:1;font-size:38px;color:var(--ink)}
.yr{font-weight:700;color:var(--blue);font-size:16px}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.navpill{display:flex;background:var(--ink);border-radius:24px;padding:4px}
.navpill a{text-decoration:none;font-size:15px;font-weight:600;color:#FFFFFF;padding:11px 18px;border-radius:20px}
.navpill a.on{color:var(--ink);background:var(--bg);font-weight:700}
.navpill a:not(.on):hover{color:#D5D8DB}
.apill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 12px;border-radius:11px;border:1px solid #C4C7CB;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
.apill a{color:inherit;text-decoration:none}.apill a:hover{text-decoration:underline}
.apill.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF;font-weight:700}
@media (max-width:899px){
  .hdr{padding:18px 20px 6px;align-items:flex-start}
  .brand{flex-direction:column;line-height:.9;padding-top:4px;gap:0}
  .wm{font-size:30px}.yr{font-size:14px;margin-top:4px}
  .navpill a{font-size:14px;padding:10px 14px;white-space:nowrap}
  /* phones: the menu gets its own full-width row, the account pill sits by the name */
  .hdr{flex-wrap:wrap;position:relative}
  .hdr-r{flex:1 1 100%;align-items:stretch}
  .navpill{justify-content:space-between}
  .navpill a{flex:1 1 auto;text-align:center;padding:10px 8px}
  .hdr-r .apill{position:absolute;top:22px;right:20px}
}
.banner-wrap{max-width:1200px;margin:14px auto 0;padding:0 40px}
@media (max-width:899px){.banner-wrap{padding:10px 20px 0;margin:0}}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:repeating-linear-gradient(135deg,#1B1D1F 0 14px,#2E3134 14px 28px);color:#FFFFFF;border-radius:16px;padding:12px 16px}
.banner .tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:#FFFFFF;color:var(--ink);font-size:14px;font-weight:900}
.banner .txt{flex:1 1 220px;font-size:14px;font-weight:600;line-height:1.4}
.banner a{color:#FFFFFF;font-size:14px;font-weight:800}

/* ---------- layout ---------- */
.view{transition:opacity .14s ease}
.view.out{opacity:0}
.wrap{max-width:1200px;margin:0 auto;padding:30px 40px 64px}
.cols{display:flex;gap:48px;align-items:flex-start}
.main{flex:1 1 0;min-width:0;max-width:700px}
.aside{width:360px;flex:0 0 360px;position:sticky;top:24px;background:var(--card);border-radius:22px;padding:22px}
@media (max-width:899px){.wrap{padding:14px 20px 24px}.cols{display:block}.main{max-width:none}}
h1.big{margin:4px 0 18px;line-height:1.08;font-weight:900;letter-spacing:-.02em;font-size:40px}
@media (max-width:899px){h1.big{font-size:28px}}
.lead{margin:0 0 8px;font-size:15px;line-height:1.45;color:var(--ink2)}
.muted{color:var(--muted)}
.loading{padding:80px 0;text-align:center;color:var(--muted);font-size:16px;font-weight:600}
.err-box{background:var(--red-bg);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.45;color:var(--red-ink);font-weight:600;margin:12px 0}

/* ---------- buttons, inputs ---------- */
.btn{height:56px;padding:0 24px;border:0;border-radius:28px;background:var(--ink);color:#FFFFFF;font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn:hover{color:#FFFFFF;background:#2E3134}
.btn:disabled{background:var(--grey);color:#FFFFFF}
.btn.red{background:var(--red)}.btn.red:hover{background:#C2271D}
.btn.wide{width:100%}
.btn2{height:48px;padding:0 20px;border-radius:24px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn2:hover{background:#FFFFFF;color:var(--ink)}
.btn2.wide{width:100%}
.sbtn{height:44px;padding:0 18px;border:0;border-radius:22px;background:var(--ink);color:#FFFFFF;font-size:15px;font-weight:800}
.sbtn2{height:44px;padding:0 18px;border-radius:22px;border:2px solid var(--ink);background:transparent;font-size:15px;font-weight:800}
.sbtn2.soft{border-color:var(--line)}
.sbtn:disabled,.sbtn2:disabled{opacity:.5}
.round{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:2px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center}
.round:disabled{opacity:.3}
.pillbtn{height:36px;padding:0 14px;border-radius:18px;border:2px solid var(--line);background:#FFFFFF;font-size:14px;font-weight:700}
.pillbtn.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.linkbtn{border:0;background:none;padding:0;font-size:inherit;font-weight:700;text-decoration:underline;color:inherit}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;min-width:0}
.fld .opt{font-weight:500;color:var(--muted)}
.inp{height:48px;border-radius:12px;border:2px solid var(--line);background:#FFFFFF;padding:0 14px;font-size:16px;font-weight:600;color:var(--ink);min-width:0;width:100%}
select.inp{padding-right:8px}
.ta{border-radius:12px;border:2px solid var(--line);padding:12px 14px;font-size:16px;font-weight:600;line-height:1.35;resize:vertical;color:var(--ink);width:100%;background:#FFFFFF}
.inp:focus,.ta:focus{border-color:var(--ink);outline:none}
.inp:focus-visible,.ta:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bad{border-color:var(--red)!important}
.ferr{font-size:13px;font-weight:700;color:var(--red-ink)}
.chip{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 4px 0 14px;border-radius:20px;background:var(--ink);color:#FFFFFF;font-size:15px;font-weight:700}
.chipx{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:#FFFFFF;font-size:18px;line-height:1}
.chipx:hover{background:#3C4043}
.add{align-self:flex-start;height:44px;padding:0 16px;border-radius:22px;border:2px dashed #9AA0A6;background:transparent;color:var(--ink);font-size:15px;font-weight:700}
.add:hover{border-color:var(--ink)}
.addin{height:44px;border-radius:22px;border:2px solid var(--ink);padding:0 16px;font-size:15px;font-weight:700;width:260px;max-width:100%}
.card{background:#FFFFFF;border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.card h2{margin:0;font-size:17px;font-weight:900}
.sw{width:56px;height:34px;flex:0 0 56px;border:0;border-radius:17px;padding:4px;display:flex;justify-content:flex-start;background:var(--grey)}
.sw[aria-checked="true"]{background:var(--ink)}
.knob{width:26px;height:26px;border-radius:50%;background:#FFFFFF;display:block}
.sw[aria-checked="true"] .knob{transform:translateX(22px)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.swrow span{font-size:15px;font-weight:700;line-height:1.3}
.opt2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.optb{height:48px;border-radius:12px;font-size:15px;font-weight:700;border:2px solid var(--line);background:#FFFFFF;color:var(--ink)}
.optb[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:#FFFFFF}

/* badges, pills */
.badge{font-size:12px;font-weight:900;height:22px;min-width:30px;padding:0 6px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;flex:0 0 auto}
.spill{display:inline-flex;align-items:center;min-height:30px;padding:5px 12px;border-radius:15px;font-size:14px;font-weight:800;line-height:1.25;max-width:100%;white-space:normal;text-align:left}
.mini{width:18px;height:18px;flex:0 0 18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;line-height:1}
.st-submitted,.st-reused,.st-reused-asis{background:var(--green);color:#FFFFFF}
.st-writing{background:var(--yellow);color:var(--ink)}
.st-assigned{background:var(--fyellow);color:var(--ink)}
.st-open{background:var(--grey2);color:var(--ink)}
.st-overdue{background:var(--red);color:#FFFFFF}
.st-removed{background:#FFFFFF;color:#C5221F;box-shadow:inset 0 0 0 2px #C5221F}
.mini.st-assigned{border:2px solid var(--yline)}
.mini.st-open{background:var(--grey)}

/* steps */
.hsteps{list-style:none;margin:0 0 18px;padding:0;position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.hsteps .track,.hsteps .fill{position:absolute;left:12.5%;top:10px;height:4px;border-radius:2px}
.hsteps .track{right:12.5%;background:var(--line)}
.hsteps .fill{background:var(--ink);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hsteps li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.sdot{width:24px;height:24px;flex:0 0 24px;border-radius:50%;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#FFFFFF;background:#FFFFFF;border:3px solid var(--grey)}
.sdot.done{background:var(--ink);border:0}
.sdot.cur{border:6px solid var(--ink)}
.slab{font-size:12px;font-weight:600;color:var(--muted)}
.slab.cur{font-weight:800;color:var(--ink)}
.vsteps{list-style:none;margin:0 0 18px;padding:0}
.vsteps li{position:relative;display:flex;align-items:center;gap:12px;min-height:40px}
.vsteps .vl{position:absolute;left:10px;top:28px;height:24px;width:4px;border-radius:2px;background:var(--line);overflow:hidden}
.vsteps .vl i{position:absolute;left:0;top:0;width:100%;height:0;background:var(--ink);transition:height .45s cubic-bezier(.2,.8,.2,1)}
.vsteps .vl.done i{height:100%}
.vsteps .slab{font-size:15px}
.summary{border-top:1px solid var(--line2);padding-top:16px;display:flex;align-items:flex-start;gap:10px}
.summary .t{font-size:18px;font-weight:900}
.summary .s{font-size:14px;color:var(--muted);margin-top:2px}
.summary .x{font-size:14px;margin-top:8px;line-height:1.4}
.darksum{background:var(--ink);color:#FFFFFF;border-radius:16px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.darksum .t{font-size:18px;font-weight:900}.darksum .s{font-size:14px;color:#D5D8DB;margin-top:2px}
.darksum a,.darksum button.linkbtn{color:#FFFFFF;font-size:14px;font-weight:700;padding:4px 0}
.darksum .badge{box-shadow:0 0 0 2px #FFFFFF;margin-top:2px}
.bottombar{position:sticky;bottom:0;padding:14px 20px 22px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;z-index:5}
.bottombar .btn{flex:1 1 auto;min-height:56px;height:auto;padding:8px 18px}
.bottombar .btn2{height:56px;padding:0 20px;font-size:16px}
.note-warn{margin-top:10px;font-size:13px;line-height:1.4;font-weight:700;color:var(--red-ink)}

/* ---------- pick (step 1) ---------- */
.searchbox{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;background:#FFFFFF;border:2px solid var(--line);margin-bottom:16px}
.searchbox:focus-within{border-color:var(--ink)}
.searchbox input{border:0;outline:none;background:transparent;font-size:15px;flex:1 1 auto;min-width:0}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}
.weeknav .mid{text-align:center;line-height:1.2}
.weeknav .mid b{display:block;font-weight:800;font-size:17px}
.weeknav .mid span{font-size:13px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:22px}
.dtab{height:72px;border-radius:14px;border:2px solid var(--line);background:#FFFFFF;color:var(--ink);padding:6px 0}
.dtab[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:#FFFFFF}
.dtab .wd{display:block;font-size:12px;font-weight:600;opacity:.75}
.dtab .dn{display:block;font-size:20px;font-weight:900;line-height:1.1}
.dtab .dd{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0}
.dtab .dc{display:block;font-size:11px;font-weight:600;opacity:.75}
@media (max-width:899px){.dtab{height:64px}}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.dayhead h2{margin:0;font-size:15px;font-weight:800}
.dayhead span{font-size:13px;color:var(--muted)}
.daynote{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:#E8EAED;color:var(--ink2);font-size:11px;font-weight:800;margin-left:8px;vertical-align:1px;white-space:nowrap;letter-spacing:.01em}
table.lt .daynote{margin-left:0;font-size:10px;padding:0 6px;height:20px}
.metro{list-style:none;margin:0;padding:0}
.stoprow{display:flex;align-items:stretch}
.rail{position:relative;width:40px;flex:0 0 40px}
.rail .bar{position:absolute;left:16px;width:8px;top:0;bottom:0}
.rail .stop{position:absolute;left:7px;top:20px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1;font-size:15px;font-weight:900;line-height:1;color:#FFFFFF;border:3px solid #FFFFFF}
.lcard{flex:1 1 auto;min-width:0;text-align:left;margin:6px 0;padding:12px 14px 14px;border-radius:16px;border:2px solid transparent;background:#FFFFFF;color:var(--ink);box-shadow:0 1px 0 var(--line);display:block}
.lcard .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lcard .tm{font-size:13px;font-weight:700;color:var(--muted)}
.lcard .tt{display:block;font-size:19px;font-weight:900;letter-spacing:-.01em;margin-top:2px}
.lcard .pf{display:block;font-size:14px;font-weight:600;margin-top:1px}
.lcard .tp{display:block;font-size:14px;line-height:1.35;margin-top:4px;color:var(--ink2)}
.lcard .sr2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-top:10px;padding-top:9px;border-top:1px solid var(--line2)}
.lcard .sr2.overdue{color:var(--red-ink)}
.lcard.sel{border-color:var(--ink);background:var(--ink);color:#FFFFFF;box-shadow:none}
.lcard.sel .tm{color:#B9BDC1}.lcard.sel .tp{color:#D5D8DB}
.lcard.sel .sr2{border-top-color:#3C4043;color:#FFFFFF}
.lcard.sel .badge{box-shadow:0 0 0 2px #FFFFFF}
.lcard.sel .mini{border:2px solid #FFFFFF}
.lcard.removed .tt{text-decoration:line-through}
.joinbtn{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:2px dashed #9AA0A6;background:transparent;color:var(--ink);min-height:56px;text-align:left}
.joinbtn[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:#FFFFFF}
.joinbtn .bx{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;background:#FFFFFF;color:var(--ink);border:2px solid var(--ink)}
.joinbtn[aria-pressed="true"] .bx{background:var(--ink);color:#FFFFFF}
.joinbtn b{display:block;font-size:14px;font-weight:800}
.joinbtn small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:1px}
.empty{background:#FFFFFF;border-radius:16px;padding:18px;color:var(--muted);font-size:15px;margin-left:40px}
.reshead{margin:18px 0 4px 40px;font-size:14px;font-weight:800;color:var(--ink2)}
.customlink{margin:18px 0 0 40px;font-size:14px;color:var(--muted)}

/* ---------- type, upload ---------- */
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:899px){.choices{display:flex;flex-direction:column;gap:12px}}
.choice{width:100%;display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:18px;border:2px solid var(--line);background:#FFFFFF;color:var(--ink);min-height:96px;text-align:left}
.choice[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.choice:disabled{opacity:.55;border-style:dashed}
.choice .ic{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.choice[aria-checked="true"] .ic{background:var(--ink);color:#FFFFFF}
.choice .tx{flex:1 1 auto}
.choice .tx b{display:block;font-size:19px;font-weight:900}
.choice .tx span{display:block;font-size:14px;line-height:1.35;color:var(--muted);margin-top:2px}
.radio{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:#FFFFFF;border:2px solid var(--grey)}
[aria-checked="true"]>.radio{border:7px solid var(--ink)}
.dgrid{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:899px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.files2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:899px){.files2{display:flex;flex-direction:column}}
.slot{display:flex;flex-direction:column;gap:8px}
.slot>span{font-size:14px;font-weight:700}
.drop{position:relative}
.fz{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:2px dashed #9AA0A6;border-radius:16px;padding:14px;color:var(--ink);min-height:76px;width:100%}
.fz:hover,.fz.over{border-color:var(--ink);background:#FFFFFF}
.fz .ico{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:#FFFFFF;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.fz b{display:block;font-size:15px;font-weight:700}
.fz small{display:block;font-size:13px;line-height:1.35;color:var(--muted)}
.ff{display:flex;align-items:center;gap:12px;background:#FFFFFF;border:2px solid var(--ink);border-radius:16px;padding:12px 8px 12px 14px;min-height:76px}
.ff .ico{width:40px;height:40px;flex:0 0 40px;border-radius:10px;color:#FFFFFF;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ff .nm{flex:1 1 auto;min-width:0}
.ff .nm b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ff .nm small{display:block;font-size:13px;color:var(--muted)}
.ff .rm{width:44px;height:44px;border:0;border-radius:50%;background:transparent;font-size:22px;color:var(--muted)}
.ff .rm:hover{background:var(--bg)}
.savedas{margin-top:18px;background:#FFFFFF;border-radius:16px;padding:14px 16px}
.savedas .k{display:block;font-size:13px;font-weight:700;color:var(--muted)}

/* ---------- motion (only when people haven't asked for less) ---------- */
@media (prefers-reduced-motion: no-preference){

  button:active:not(:disabled){transform:scale(.97)}
  .knob{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
  .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .drop{animation:drop .32s cubic-bezier(.2,.8,.2,1) both}
  .pop{animation:pop .42s cubic-bezier(.2,.9,.25,1.2) both}
  .cb:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(27,29,31,.18)}
  .cb.on:hover{box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px var(--blue),0 4px 10px rgba(27,29,31,.18)}
  .lcard,.dtab,.choice,.what,.joinbtn,.optb,.partb{transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,transform .18s cubic-bezier(.2,.8,.2,1)}
  .lcard .tm,.lcard .tp,.lcard .sr2,.lcard .badge,.lcard .mini{transition:color .25s ease,border-color .25s ease,box-shadow .25s ease}
  table.lt tr.row.flash{animation:flashrow 1.4s ease-out 2}
  .dcard.flash{animation:flashcard 1.4s ease-out 2}
  .done .line-in{transform-origin:top;animation:drawline .55s cubic-bezier(.5,0,.2,1) both}
  .done .line-out{transform-origin:top;animation:drawline .7s cubic-bezier(.2,.8,.2,1) 1.25s both}
  .done .train{animation:train .5s cubic-bezier(.6,0,.4,1) .35s both}
  .done .stopbig{animation:arrive .7s cubic-bezier(.2,.9,.2,1.25) .8s both}
  .done .tick{stroke-dasharray:40;stroke-dashoffset:40;animation:tick .45s ease-out 1.25s forwards}
  .done .ring{animation:ring 1.2s cubic-bezier(.1,.6,.3,1) both}
  .done .bit{animation:burst 1.9s cubic-bezier(.15,.7,.3,1) both}
  .done .up{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  .done .tk{animation:pop .4s cubic-bezier(.2,.9,.25,1.4) both}
  .done .glow{animation:rise .55s cubic-bezier(.2,.8,.2,1) both,glow 1.6s ease-in-out 2.4s 2}
}
@media (prefers-reduced-motion: reduce){
  .view{transition:none}

}

.hsec h2{margin:0;font-size:24px;font-weight:900}
.hshow{height:38px;font-size:14px;padding:0 14px}
.hlead{margin:8px 0 0;font-size:15px;line-height:1.5;color:var(--ink2)}
.hdl{margin:14px 0 0;display:flex;flex-direction:column}
.hdl>div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding:12px 0;border-top:1px solid var(--line2)}
.hdl dt{font-size:14px;font-weight:800}
.hdl dd{margin:0;font-size:15px;line-height:1.55;color:var(--ink2)}
.hk{display:inline-block;padding:0 7px;border-radius:6px;font-weight:700}
.hk.g{background:#DDF3E3;color:var(--green-ink)}.hk.y{background:var(--fyellow);color:#7A5900}.hk.r{background:var(--red-bg);color:var(--red-ink)}.hk.n{background:var(--grey2);color:var(--ink2)}
.htab{margin-top:16px;overflow-x:auto}
.htab table{width:100%;border-collapse:collapse;font-size:14px}
.htab th,.htab td{padding:9px 10px;border-top:1px solid var(--line2);text-align:left;vertical-align:top}
.htab thead th{border-top:0;font-size:13px;font-weight:800;color:var(--muted);text-align:center;white-space:nowrap}
.htab tbody th{font-weight:600;color:var(--ink)}
.htab td{text-align:center;width:96px}
.htab .me{background:var(--hl)}
.htab thead .me{color:var(--ink);border-radius:10px 10px 0 0}
.htab .you{display:block;margin:3px auto 0;width:max-content;padding:1px 8px;border-radius:8px;background:var(--blue);color:#FFFFFF;font-size:11px;font-weight:800}
.htab .yes{color:var(--green-ink);font-weight:900;font-size:16px}.htab .no{color:var(--note)}
.hpriv th{width:34%}
.hpriv td{text-align:left;width:auto;color:var(--ink2);line-height:1.5}
.hyou{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--hl);font-size:14px;font-weight:600;line-height:1.45}
.hq{border-top:1px solid var(--line2);padding:2px 0}
.hq:first-of-type{margin-top:12px}
.hq summary{cursor:pointer;padding:12px 0;font-size:15px;font-weight:800}
.hq p{margin:0 0 14px;font-size:15px;line-height:1.55;color:var(--ink2)}
@media (max-width:899px){
  .hgrid{display:block;margin-top:18px}
  .hnav{position:static;flex-direction:row;overflow-x:auto;gap:6px;margin:0 -20px 16px;padding:2px 20px 6px;scrollbar-width:none}
  .hnav a{flex:0 0 auto;background:#FFFFFF;border-radius:16px;padding:7px 12px;font-size:13px}
  .hbody{gap:14px}
  .hsec{padding:18px 16px;border-radius:18px}
  .hsec h2{font-size:21px}
  .hdl>div{display:block;padding:10px 0}
  .hdl dt{margin-bottom:3px}
  .htab th,.htab td{padding:8px 6px}
  .htab td{width:62px}
  .htab thead th{white-space:normal;font-size:12px}
  .hpriv th,.hpriv td{display:block;width:auto;border-top:0;padding:0}
  .hpriv tr{display:block;border-top:1px solid var(--line2);padding:10px 0}
  .hpriv th{margin-bottom:3px}
}
@media print{
  html,body{background:#FFFFFF}
  #hdr,#banner,#sfoot,#toast,.hnav,.hshow,.hprint{display:none!important}
  .hgrid{display:block;margin-top:12px}
  .hsec{padding:12px 0;border-radius:0;break-inside:avoid-page}
  .help .rise{animation:none!important;opacity:1!important;transform:none!important}
}

<script>
// Schedule parser — turns pdf.js text items into lecture rows.
// Pure function; the same code is embedded in the web app's admin page.
// pages: [{ items: [{ str, x, y, w }] }]  (y measured from the TOP of the page)
function parseSchedule(pages) {
  var MONTHS = { january:1, february:2, march:3, april:4, may:5, june:6, july:7,
    august:8, september:9, october:10, november:11, december:12,
    gennaio:1, febbraio:2, marzo:3, aprile:4, maggio:5, giugno:6, luglio:7,
    agosto:8, settembre:9, ottobre:10, novembre:11, dicembre:12 };
  var TIME_RE = /^(\d{1,2})[.:](\d{2})\s*[-‐-―]\s*(\d{1,2})[.:](\d{2})\s*(.*)$/;
  var DATE_RE = /(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/;
  var COLS = { prof: 115, course: 178, module: 260, topic: 322, room: 452 };
  var clean = function (s) { return String(s || '').replace(/[‐-―]/g, '-').replace(/\s+/g, ' ').trim(); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  var lectures = [], warnings = [], dayNotes = {};
  var starts = {};
  pages.forEach(function (page) {
    page.items.forEach(function (it) { if (clean(it.str) && it.y >= 85 && !/^CLERKSHIP/i.test(clean(it.str))) { var k = Math.round(it.x); starts[k] = (starts[k] || 0) + 1; } });
  });

  pages.forEach(function (page, pi) {
    var items = page.items.filter(function (it) { return clean(it.str); })
      .map(function (it) { return { str: clean(it.str), x: it.x, y: it.y, w: it.w || 0 }; });

    // Calibrate columns from the header row if present (layout may drift slightly)
    var hdr = {};
    items.forEach(function (it) { if (it.y < 90) hdr[it.str.toUpperCase()] = it.x; });
    var shift = hdr.DATE !== undefined ? hdr.DATE - 69 : 0;
    var col = {}; Object.keys(COLS).forEach(function (k) { col[k] = COLS[k] + shift; });
    // Column widths change between versions too. Cells are left-aligned and headings centred, so each
    // column starts at the commonest left edge of cell text just left of its heading (counted over every page).
    var edges = Object.keys(starts).map(Number).filter(function (x) { return starts[x] + (starts[x - 1] || 0) + (starts[x + 1] || 0) >= 3; });
    var HEAD = { course: 'COURSE', module: 'MODULE', topic: 'TOPIC', room: 'ROOM' }, prev = col.prof + 15;
    ['course', 'module', 'topic', 'room'].forEach(function (k) {
      var hx = hdr[HEAD[k]];
      if (hx === undefined) { prev = col[k]; return; }
      // the commonest edge between the previous column and this heading, or the default if there's none
      var best = edges.filter(function (x) { return x > prev && x <= hx + 1; }).sort(function (a, b) { return starts[b] - starts[a] || b - a; })[0];
      if (best !== undefined) col[k] = best - 4;
      prev = col[k] + 8;
    });

    // 1) time rows
    var rows = [];
    items.forEach(function (it) {
      if (it.x > col.prof + 10) return;
      var m = it.str.match(TIME_RE);
      if (!m) return;
      rows.push({ y: it.y, start: pad(+m[1]) + ':' + m[2], end: pad(+m[3]) + ':' + m[4],
        startMin: +m[1] * 60 + +m[2], profInline: clean(m[5]), cells: { prof: [], course: [], module: [], topic: [], room: [] } });
    });
    rows.sort(function (a, b) { return a.y - b.y; });

    // 2) date labels (column left of time column); merge 2-line labels
    var dl = items.filter(function (it) { return it.x < col.prof - 25 && !TIME_RE.test(it.str) && it.y > 85; })
      .sort(function (a, b) { return a.y - b.y; });
    var labels = [];
    dl.forEach(function (it) {
      var last = labels[labels.length - 1];
      if (last && !DATE_RE.test(last.text) && it.y - last.y2 <= 9) { last.text += ' ' + it.str; last.y2 = it.y; }
      else labels.push({ text: it.str, y1: it.y, y2: it.y });
    });
    var dates = [];
    labels.forEach(function (l) {
      var m = l.text.match(DATE_RE);
      if (!m || !MONTHS[m[2].toLowerCase()]) return;
      dates.push({ iso: m[3] + '-' + pad(MONTHS[m[2].toLowerCase()]) + '-' + pad(+m[1]), y: (l.y1 + l.y2) / 2 - 3.5, used: false });
    });

    // 3) group rows into days (start time goes back down => new day)
    var days = [], cur = null;
    rows.forEach(function (r) {
      if (!cur || r.startMin <= cur.rows[cur.rows.length - 1].startMin || r.y - cur.rows[cur.rows.length - 1].y > 30) {
        cur = { rows: [] }; days.push(cur);
      }
      cur.rows.push(r);
    });
    days.forEach(function (d) {
      var c = (d.rows[0].y + d.rows[d.rows.length - 1].y) / 2, best = null, bd = 1e9;
      dates.forEach(function (dt) { var dist = Math.abs(dt.y - c); if (dist < bd) { bd = dist; best = dt; } });
      if (!best || bd > 30) { warnings.push('Page ' + (pi + 1) + ': could not match a date to slots near y=' + Math.round(c)); return; }
      if (best.used) warnings.push('Page ' + (pi + 1) + ': date ' + best.iso + ' matched twice');
      best.used = true; d.date = best.iso; d.yTop = d.rows[0].y - 12; d.yBot = d.rows[d.rows.length - 1].y + 4;
    });

    // 4) distribute cell text to rows
    items.forEach(function (it) {
      if (it.x < col.prof - 25 || it.y < 85) return;            // date column / header
      if (it.x <= col.prof + 10 && TIME_RE.test(it.str)) return; // time cell
      if (/^CLERKSHIP/i.test(it.str)) {                           // day-level note
        var d = days.filter(function (d) { return d.date && it.y >= d.yTop - 30 && it.y <= d.yBot + 30; })
          .sort(function (a, b) { return Math.abs((a.yTop + a.yBot) / 2 - it.y) - Math.abs((b.yTop + b.yBot) / 2 - it.y); })[0];
        if (d) dayNotes[d.date] = it.str;
        return;
      }
      // nearest row; multi-line cells are vertically centred about 3pt above the time baseline
      var row = null, bd = 1e9;
      rows.forEach(function (r) { var dist = Math.abs(r.y - 3 - it.y); if (dist < bd) { bd = dist; row = r; } });
      if (!row || bd > 9.5) return;
      var k = it.x >= col.room ? 'room' : it.x >= col.topic ? 'topic' : it.x >= col.module ? 'module' : it.x >= col.course ? 'course' : 'prof';
      row.cells[k].push(it);
    });

    days.forEach(function (d) {
      if (!d.date) return;
      d.rows.forEach(function (r) {
        var j = function (k) { return clean(r.cells[k].sort(function (a, b) { return a.y - b.y || a.x - b.x; }).map(function (i) { return i.str; }).join(' ')); };
        var prof = clean([r.profInline, j('prof')].join(' '));
        if (!prof) return; // empty slot
        var room = j('room'), topic = j('topic'), module = j('module'), course = j('course');
        // "MAXILLO-FACIAL SURGERY traumatology": lowercase tail spilled into module column = topic
        var mm = module.match(/^([A-Z0-9 \-\/&']+?)\s+([a-z].*)$/);
        if (mm) { module = mm[1]; topic = clean(mm[2] + ' ' + topic); }
        var lec = { id: d.date + 'T' + r.start, date: d.date, start: r.start, end: r.end,
          professor: prof, course: course, module: module, topic: topic, room: room };
        // "MEDICAL SCIENCE AND CLINICAL INVESTIGATION INTERNAL MEDICINE" written across the course and
        // module columns as one piece of text: remember roughly where the module column cut it
        var over = r.cells.course.filter(function (i) { return i.x + i.w > col.module + 6; })[0];
        if (!module && over) {
          var at = course.indexOf(over.str);
          if (at >= 0) lec.merged = at + over.str.length * (col.module + 4 - over.x) / (over.w || 1);
        }
        lectures.push(lec);
      });
    });
  });

  // split merged course + module text: at a course name seen on its own elsewhere, else at the word nearest the cut
  var known = {};
  lectures.forEach(function (l) { if (l.merged === undefined && l.course && l.module) known[l.course] = 1; });
  lectures.forEach(function (l) {
    if (l.merged === undefined) return;
    var s = l.course, cut = Object.keys(known).filter(function (k) { return s.indexOf(k + ' ') === 0; }).sort(function (a, b) { return b.length - a.length; })[0];
    var i = cut ? cut.length : -1;
    if (i < 0) {
      var bd = 1e9;
      for (var p = s.indexOf(' '); p >= 0; p = s.indexOf(' ', p + 1)) if (Math.abs(p - l.merged) < bd) { bd = Math.abs(p - l.merged); i = p; }
    }
    if (i > 0) { l.course = clean(s.slice(0, i)); l.module = clean(s.slice(i)); }
    delete l.merged;
  });

  lectures.sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
  // lecture number = order within module
  var cnt = {};
  lectures.forEach(function (l) { cnt[l.module] = (cnt[l.module] || 0) + 1; l.number = cnt[l.module]; });
  return { lectures: lectures, dayNotes: dayNotes, warnings: warnings };
}
if (typeof module !== 'undefined') module.exports = parseSchedule;
</script>

// Admin-only author chips. The server re-checks on every change. Volunteers are grey, with Confirm.
// Workload per person: a new sbobina counts 1, last year's with edits 0.5, last year's as is 0.25, and one not
// written yet (to be held, being written or overdue) 0.75. A lecture shared by several authors is split between them.
var WEIGHT = { fresh: 1, edited: 0.5, asis: 0.25, todo: 0.75 };
function workload() {
  var by = {}, key = function (n) { return fold(String(n).trim()); };   // "Ayca" and "Ayça" are the same person
  var get = function (n) { var k = key(n); return by[k] || (by[k] = { name: n, fresh: 0, edited: 0, asis: 0, todo: 0, score: 0, days: {} }); };
  (S.data.members || []).forEach(get);
  S.data.lectures.forEach(function (l) {
    if (l.removed || l.cancelled) return;
    var kind = l.st === 'submitted' ? 'fresh' : l.st === 'reused' ? 'edited' : l.st === 'reused-asis' ? 'asis' : l.asg.length ? 'todo' : '';
    if (!kind) return;
    var who = green(l.st) ? (l.who.length ? l.who : l.asg) : l.asg;
    who.forEach(function (n) { var p = get(n); p[kind]++; p.score += WEIGHT[kind] / who.length; p.days[l.date] = 1; });
  });
  var out = Object.keys(by).map(function (k) { var p = by[k]; p.member = (S.data.members || []).some(function (m) { return key(m) === k; }); p.score = Math.round(p.score * 100) / 100; return p; });
  return out.sort(function (a, b) { return a.score - b.score || a.name.localeCompare(b.name); });
}
// Every approved classmate not on this lecture, lightest workload first. On a tie, whoever's nearest lecture
// (before or after this one) is furthest away comes first, then by name.
function suggestFor(l) {
  var on = l.asg.map(fold), t = isoMs(l.date);
  var gap = function (p) { var ds = Object.keys(p.days); return ds.length ? Math.min.apply(null, ds.map(function (d) { return Math.abs(isoMs(d) - t); })) / 86400000 : Infinity; };
  return workload().filter(function (p) { return p.member && on.indexOf(fold(p.name)) < 0; })
    .map(function (p) { p.gap = gap(p); return p; })
    .sort(function (a, b) { return a.score - b.score || b.gap - a.gap || a.name.localeCompare(b.name); });
}
function pickListHtml(l, q) {
  q = fold(String(q || '').trim());
  var list = suggestFor(l).filter(function (p) { return !q || fold(p.name).indexOf(q) >= 0; });
  if (!list.length) return '<div class="pkempty">' + (q ? 'Nobody on the approved list matches. Press Enter to add this name anyway.' : 'Everyone on the approved list is already on it.') + '</div>';
  return list.map(function (p) {
    var far = p.gap === Infinity ? 'no lectures yet' : p.gap === 0 ? 'has a lecture that day' : 'nearest lecture ' + Math.round(p.gap) + ' ' + pl(Math.round(p.gap), 'day', 'days') + ' away';
    return '<button type="button" class="pkrow" data-suggest="' + h(l.id) + '" data-name="' + h(p.name) + '" aria-label="Add ' + h(p.name) + ', workload ' + p.score + ', ' + far + '"><span class="pn">' + h(p.name) + '<small>' + h(far) + '</small></span><span class="ps">' + p.score + '</span></button>';
  }).join('');
}
function renderWorkload() {
  var box = $('#workbox');
  if (!box || !S.data) return;
  var list = workload();
  if (!list.length) { box.innerHTML = '<p class="sub" style="margin:0">Nobody has lectures yet.</p>'; return; }
  var ms = list.filter(function (p) { return p.member; }), base = ms.length ? ms : list;
  var tot = base.reduce(function (a, p) { return a + p.score; }, 0), mem = base.length;
  box.innerHTML = '<p class="sub" style="margin:0 0 12px;max-width:760px">Each person\'s share of the writing. A new sbobina counts 1, last year\'s with edits 0.5, last year\'s used as is 0.25, and one not written yet (to be held, being written or overdue) 0.75. A lecture with several authors is split between them. The average for approved classmates is <b>' + (Math.round(tot / mem * 100) / 100) + '</b>. When you press + Add on a lecture, everyone approved is listed, lightest load first.</p>' +
    '<div class="tablebox stbox"><table class="stt"><thead><tr><th scope="col">Name</th><th scope="col">New</th><th scope="col">Last year\'s, edited</th><th scope="col">Last year\'s, as is</th><th scope="col">Still to write</th><th scope="col">Workload</th></tr></thead><tbody>' +
    list.map(function (p) {
      return '<tr><th scope="row">' + h(p.name) + (p.member ? '' : ' <span class="meta">not on the approved list</span>') + '</th><td>' + p.fresh + '</td><td>' + p.edited + '</td><td>' + p.asis + '</td><td>' + p.todo + '</td><td><b>' + p.score + '</b></td></tr>';
    }).join('') + '</tbody></table></div>';
}
function authorEditor(l) {

      '<button class="chipx" data-unassign="' + h(l.id) + '" data-name="' + h(n) + '" aria-label="Remove ' + h(n) + ' from ' + h(lecTitle(l)) + '">×</button></span>';
  }).join('') + '<button class="add" data-addname="' + h(l.id) + '" aria-label="Add an author to ' + h(lecTitle(l)) + '">+ Add</button></span>';

function wireAuthorEditors(root, onChange) {

// The semester board's lecture pop-up: hover (or keyboard focus) on computers, first tap on phones

function showPop(btn) {

// Weeks: swipe the list, or scroll sideways on a trackpad, to change week
function wireWeekSwipe(el) {
  if (!el) return;
  var acc = 0, flipAt = 0, down = null;
  el.addEventListener('wheel', function (e) {
    if (DI.course || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    acc += e.deltaX;
    var now = Date.now();
    if (Math.abs(acc) > 90 && now - flipAt > 550) { flipAt = now; diaryWeek(acc > 0 ? 1 : -1); acc = 0; }
  }, { passive: true });
  el.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY }; DI.dragged = false; });
  el.addEventListener('pointermove', function (e) { if (down && Math.abs(e.clientX - down.x) > 12 && Math.abs(e.clientX - down.x) > Math.abs(e.clientY - down.y)) DI.dragged = true; });
  var up = function (e) {
    var d = down; down = null;
    if (d && !DI.course && DI.dragged && Math.abs(e.clientX - d.x) > 60) diaryWeek(e.clientX < d.x ? 1 : -1);
    setTimeout(function () { DI.dragged = false; }, 0);
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', function () { down = null; DI.dragged = false; });
}

// Phones: swipe from the left edge of a pushed screen to go back, the screen following the finger
function wireEdgeBack(el) {
  if (!el) return;
  var start = null, dx = 0;
  el.addEventListener('pointerdown', function (e) {
    if (desk() || e.pointerType === 'mouse' || e.clientX > 28) return;
    start = e.clientX; dx = 0;

    try { el.setPointerCapture(e.pointerId); } catch (x) {}
  });
  el.addEventListener('pointermove', function (e) {

    var dim = $('#ddim'); if (dim) dim.style.opacity = String(0.18 * (1 - Math.min(1, dx / window.innerWidth)));
  });
  var end = function () {
    if (start === null) return;

  st('Saving…');

  var members = g.members.map(function (m) {
    if (m.me && m.progress) m.progress = myProgress();
    var right = m.progress ? '<span class="cnum">' + m.progress.studied + ' / ' + m.progress.total + '</span>'
      : '<span class="lock">' + (m.me ? 'Private' : g.share ? 'Keeps it private' : 'Hidden') + '</span>';
    return '<div class="mem"><span class="av" aria-hidden="true" style="background:' + avColor(m.id) + '">' + h((m.name || '?').charAt(0)) + '</span>' +
      '<span class="grow"><b>' + h(m.name) + '</b>' + (m.owner ? ' <span class="otag">made the group</span>' : '') + pb(m.progress) + '</span>' + right +
      (g.mine && !m.me ? '<button class="xs" data-gremove="' + h(g.id) + '" data-m="' + h(m.id) + '" aria-label="Take ' + h(m.name) + ' out of the group">×</button>' : '') + '</div>';
  }).join('');
  var invites = g.invites.length ? '<p class="sub" style="margin:8px 0 0;font-size:13px">Invited: ' + g.invites.map(function (i) { return h(i.email) + (g.mine ? ' <button class="linkbtn" data-guninvite="' + h(g.id) + '" data-e="' + h(i.email) + '" style="font-size:12px;color:#5F6368">withdraw</button>' : ''); }).join(', ') + '</p>' : '';
  var aims = Object.keys(g.aims).map(function (id) {
    var l = byId[id], a = g.aims[id];
    return l ? '<div class="li2" style="padding:8px 0;font-size:14px"><span class="grow">' + h(lecTitle(l)) + '<small>Set by ' + h(a.by) + '</small></span><span style="display:flex;gap:8px;align-items:center"><span class="aim grp">' + h(dayLabel_(a.date)) + '</span><button class="linkbtn" data-daim="' + h(id) + '" data-g="' + h(g.id) + '" style="font-size:13px">Change</button></span></div>' : '';
  }).join('');
  var shared = (S.diary.res.filter(function (r) { return (r.groups || []).indexOf(g.id) >= 0; }).map(function (r) { return { t: r.title, u: r.url, by: 'You' }; }))
    .concat((S.diary.shared || []).filter(function (r) { return r.groupIds.indexOf(g.id) >= 0; }).map(function (r) { return { t: r.title, u: r.url, by: r.by }; }));
  return '<section class="box grp" aria-label="' + h(g.name) + '">' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h3>' + h(g.name) + '</h3><span class="meta">' + g.members.length + ' ' + pl(g.members.length, 'person', 'people') + '</span></div>' +
    '<div class="swrow"><span id="gs-' + h(g.id) + '">Share my progress with this group</span><button class="sw" role="switch" aria-labelledby="gs-' + h(g.id) + '" aria-checked="' + g.share + '" data-gshare="' + h(g.id) + '"><span class="knob"></span></button></div>' +
    '<p class="sub" style="margin:6px 0 4px;font-size:13px">' + (g.share ? 'You see the others who share too.' : 'Your ticks are private here, so you don\'t see anyone else\'s either.') + '</p>' +
    members + invites +
    (g.members.length === 1 && !g.invites.length ? '<p class="ehint" style="margin-top:8px">Just you so far. Invite classmates by email: they get an email, and the invite waits in their study diary.</p>' : '') +
    '<form class="ginv" data-ginvite="' + h(g.id) + '"><label class="sr" for="gi-' + h(g.id) + '">Invite by email</label><input class="inp" id="gi-' + h(g.id) + '" type="text" inputmode="email" placeholder="Invite by email" autocomplete="off"><button class="sbtn">Invite</button></form>' +
    '<h4>Shared aims</h4>' + (aims || '<p class="sub" style="margin:0;font-size:13px">None yet. Set one from a lecture: choose the group when you set the aim. Anyone in the group can change it.</p>') +
    '<h4>Shared resources</h4>' + (shared.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px">' + shared.map(function (r) { return '<a class="rchip" href="' + h(r.u) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;padding-right:10px">' + h(r.t) + '<span class="pv sh">' + h(r.by) + '</span></a>'; }).join('') + '</div>'
      : '<p class="sub" style="margin:0;font-size:13px">None yet. Share one of your resources from its ⋯ menu.</p>') +
    '<div style="margin-top:14px">' + (DI.leaving === g.id ? '<span style="display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="sbtn" data-gleave="' + h(g.id) + '" style="background:#D93025;height:36px">Leave ' + h(g.name) + '</button><button class="linkbtn" data-gleavecancel="1">Cancel</button></span>'
      : '<button class="linkbtn" data-gleave="' + h(g.id) + '" style="font-size:13px;color:#5F6368">Leave the group</button>') + '</div></section>';
}
function avColor(id) { var c = ['#2457D6', '#8146D6', '#0E8F92', '#E8A600', '#D93025', '#1E7B37', '#5F6368']; var n = 0; for (var i = 0; i < String(id).length; i++) n = (n * 31 + String(id).charCodeAt(i)) % 997; return c[n % c.length]; }

function diaryCall(name, req, msg, btn) {
  if (btn) busy(btn, true, '…');
  return api(name, req).then(function (d) { setDiary(d); drawDiary(); if (msg) toast(typeof msg === 'function' ? msg(d) : msg); }, function (x) { if (btn) busy(btn, false); toast(x.message, true); drawDiary(); });
}
function setTickTo(id, s, focusSel) {
  var l = byId[id];
  if (s) S.diary.ticks[id] = s; else delete S.diary.ticks[id];
  drawProgress(); drawList(); if (DI.sel === id) drawDetail();
  var nb = $(focusSel); if (nb) nb.focus({ preventScroll: true });
  drawGroups();
  // the page already shows it; the server's answer only matters if it went wrong
  TICKQ.n++;
  api('diaryTick', { lectureId: id, state: s }).then(function () { TICKQ.n--; toast(lecTitle(l) + ': ' + TICKS[s] + '.'); },
    function (x) {
      TICKQ.n--; toast(x.message, true);
      api('diary').then(function (d) { if (!TICKQ.n) { setDiary(d); drawDiary(); } });
    });
}
var TICKQ = { n: 0 };
// your own progress in a group card, from your ticks as they are now
function myProgress() {
  var t = S.diary.ticks || {}, s = 0, h = 0, n = 0;
  S.data.lectures.forEach(function (l) { if (l.removed || l.cancelled) return; n++; if (t[l.id] === 2) s++; else if (t[l.id] === 1) h++; });
  return { studied: s, started: h, total: n };
}
function diaryClick(e) {
  var t = e.target.closest('[data-dtick]');
  if (t) { var id = t.getAttribute('data-dtick'); setTickTo(id, ((S.diary.ticks[id] || 0) + 1) % 3, '[data-dtick="' + id + '"]'); return; }
  var ds = e.target.closest('[data-dset]');
  if (ds) { var sid = ds.getAttribute('data-dset'), k = +ds.getAttribute('data-s'); setTickTo(sid, k, '[data-dset="' + sid + '"][data-s="' + k + '"]'); return; }
  var op = e.target.closest('[data-dopen]');
  if (op) { if (DI.dragged) return; openDiaryLecture(op.getAttribute('data-dopen')); return; }
  if (e.target.closest('[data-dclose]') || e.target.closest('[data-dgclose]')) { closeDiaryPane(); return; }
  if (e.target.closest('[data-dgroups]')) { DI.groups = true; DI.sel = ''; drawList(); diaryLayout(); var gb = $('#dside .backb'); if (gb) gb.focus({ preventScroll: true }); return; }
  var c = e.target.closest('[data-dcourse]');
  if (c) { DI.course = c.getAttribute('data-dcourse'); DI.module = ''; dropSelOutside(); drawDiary(); scrollToToday(); return; }
  var dm = e.target.closest('[data-dmod]');
  if (dm) { DI.module = dm.getAttribute('data-dmod'); dropSelOutside(); drawDiary(); scrollToToday(); return; }
  var w = e.target.closest('[data-dw]');
  if (w) { var dv = +w.getAttribute('data-dw'); if (dv) diaryWeek(dv); else if (DI.week !== curWeek()) diaryWeek(curWeek() - DI.week); return; }
  var a = e.target.closest('[data-daim]');
  if (a) { openAim(a.getAttribute('data-daim'), a.getAttribute('data-g') || ''); return; }
  var r = e.target.closest('[data-radd]');
  if (r) { openAddRes(r.getAttribute('data-radd')); return; }
  var rt = e.target.closest('[data-reltopic]');
  if (rt) { var tid = rt.getAttribute('data-reltopic'); go('dashboard'); setTimeout(function () { jump(tid); var inp = $('[data-topic="' + tid + '"]'); if (inp) inp.focus(); }, 400); return; }
  var rr = e.target.closest('[data-relretry]');
  if (rr) { var rrid = rr.getAttribute('data-relretry'); delete REL.data[rrid]; relRedraw(rrid); relFetch(rrid); return; }
  var rm = e.target.closest('[data-relmore]');
  if (rm) { var rmid = rm.getAttribute('data-relmore'); REL.more[rmid] = !REL.more[rmid]; relRedraw(rmid); return; }
  var rp = e.target.closest('[data-relprev]');
  if (rp) { track('rel:preview', rp.getAttribute('data-relprev')); openRelPreview(rp.getAttribute('data-relprev'), rp.getAttribute('data-doc')); return; }
  var rn = e.target.closest('[data-relnew]');
  if (rn) { track('rel:newtab', rn.getAttribute('data-relnew')); return; }
  var ra = e.target.closest('[data-reladd]');
  if (ra) {
    var aid = ra.getAttribute('data-reladd'), it = relItem(aid, ra.getAttribute('data-doc'));
    if (it) { track('rel:add', aid); diaryCall('diaryRes', { scope: aid, items: [{ kind: 'class', url: it.url, title: it.title.slice(0, 120) }] }, 'Added to ' + lecTitle(byId[aid]) + ' in your diary.', ra); }
    return;
  }
  var rh = e.target.closest('[data-relhide]');
  if (rh) {
    var hid = rh.getAttribute('data-relhide');
    busy(rh, true, '…');
    api('relevantHide', { lectureId: hid, doc: rh.getAttribute('data-doc') }).then(function (res) { REL.data[hid] = res; relRedraw(hid); toast('Hidden for this lecture, for everyone.'); }, function (x) { busy(rh, false); toast(x.message, true); });
    return;
  }
  var m = e.target.closest('[data-rmore]');
  if (m) { openResMenu(m); return; }
  var sh = e.target.closest('[data-showhid]');
  if (sh) { var sc = sh.getAttribute('data-showhid'); DI.showHid[sc] = !DI.showHid[sc]; drawDiary(); return; }
  var gn = e.target.closest('[data-gnew]');
  if (gn) { DI.newGroup = gn.getAttribute('data-gnew') === '1'; drawGroups(); return; }
  var ga = e.target.closest('[data-ganswer]');
  if (ga) { var acc = ga.getAttribute('data-acc') === '1'; diaryCall('groupAnswer', { groupId: ga.getAttribute('data-ganswer'), accept: acc }, acc ? 'You\'re in. Your progress stays private until you switch on sharing.' : 'Invite declined.', ga); return; }
  var gs = e.target.closest('[data-gshare]');
  if (gs) { var on = gs.getAttribute('aria-checked') !== 'true'; diaryCall('groupShare', { groupId: gs.getAttribute('data-gshare'), share: on }, on ? 'You share your progress with this group, and see the others who share.' : 'Your progress is private here. You no longer see the others\' either.', gs); return; }
  var gr = e.target.closest('[data-gremove]');
  if (gr) { diaryCall('groupLeave', { groupId: gr.getAttribute('data-gremove'), member: gr.getAttribute('data-m') }, 'Taken out of the group.', gr); return; }
  var gu = e.target.closest('[data-guninvite]');
  if (gu) { diaryCall('groupLeave', { groupId: gu.getAttribute('data-guninvite'), invite: gu.getAttribute('data-e') }, 'Invite withdrawn.', gu); return; }
  var gl = e.target.closest('[data-gleave]');
  if (gl) {
    var gid = gl.getAttribute('data-gleave');
    if (DI.leaving !== gid) { DI.leaving = gid; drawGroups(); return; }
    DI.leaving = '';
    diaryCall('groupLeave', { groupId: gid }, 'You left the group.', gl);
    return;
  }
  if (e.target.closest('[data-gleavecancel]')) { DI.leaving = ''; drawGroups(); }
}
function diarySubmit(e) {
  if (e.target.id === 'gnew') {
    e.preventDefault();
    var nm = $('#gname').value.trim();
    if (!nm) { $('#gname').focus(); return; }
    DI.newGroup = false;
    diaryCall('groupCreate', { name: nm }, 'Group created. Invite people by email.', $('#gnewgo'));
    return;
  }
  var inv = e.target.closest('[data-ginvite]');
  if (inv) {
    e.preventDefault();
    var gid = inv.getAttribute('data-ginvite'), inp = inv.querySelector('input'), val = inp.value.trim();
    if (!val) { inp.focus(); return; }
    diaryCall('groupInvite', { groupId: gid, emails: val }, function (d) { return d.invitedNow ? (d.invitedNow === 1 ? 'Invite sent.' : d.invitedNow + ' invites sent.') + ' They join once they accept.' : 'They\'re already in the group or invited.'; }, inv.querySelector('button'));
  }
}

function openAim(id, gid) {
  var l = byId[id], d = $('#repdlg');
  if (!l || !d) return;
  var groups = S.diary.groups || [];
  var cur = function (g) { return g ? (groupById(g) && groupById(g).aims[id] ? groupById(g).aims[id].date : '') : (S.diary.aims[id] || ''); };
  d.innerHTML = '<form id="aimform"><h2 id="rep-h" style="margin:0 0 4px;font-size:22px;font-weight:900">Aim to finish ' + h(lecTitle(l)) + '</h2>' +
    '<p style="margin:0 0 4px;font-size:14px;line-height:1.45;color:#3C4043">A date you want to have it studied by.</p>' +
    (groups.length ? '<fieldset style="border:0;padding:0;margin:12px 0 0"><legend style="font-size:14px;font-weight:800;padding:0">Whose aim is it</legend>' +
      '<label class="check" style="margin-top:4px"><input type="radio" name="aimwho" value=""' + (gid ? '' : ' checked') + '><span aria-hidden="true" class="bx" style="border-radius:50%">✓</span>Just mine (only I see it)</label>' +
      groups.map(function (g) { return '<label class="check" style="margin-top:4px"><input type="radio" name="aimwho" value="' + h(g.id) + '"' + (gid === g.id ? ' checked' : '') + '><span aria-hidden="true" class="bx" style="border-radius:50%">✓</span>' + h(g.name) + '\'s (everyone in it sees it and can change it)</label>'; }).join('') + '</fieldset>' : '') +
    '<label class="fld" style="margin-top:12px">By<input class="inp" type="date" id="aimdate" value="' + h(cur(gid)) + '" min="' + h(l.date) + '"></label>' +
    '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px"><button class="sbtn" id="aimgo">Save</button><button type="button" class="sbtn2" id="aimdel">Remove this aim</button><button type="button" class="sbtn2 soft" id="aimno">Cancel</button></div></form>';
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  var close = function () { if (d.close) d.close(); else d.removeAttribute('open'); };
  var who = function () { var x = d.querySelector('input[name="aimwho"]:checked'); return x ? x.value : ''; };
  d.querySelectorAll('input[name="aimwho"]').forEach(function (x) { x.onchange = function () { $('#aimdate').value = cur(who()); }; });
  $('#aimno').onclick = close;
  var save = function (date) {
    var g = who();
    close();
    if (g) diaryCall('groupAim', { groupId: g, lectureId: id, date: date }, date ? 'Group aim saved. Everyone in ' + groupById(g).name + ' sees it.' : 'Group aim removed.');
    else diaryCall('diaryAim', { lectureId: id, date: date }, date ? 'Aim saved: ' + dayLabel_(date) + '.' : 'Aim removed.');
  };
  $('#aimdel').onclick = function () { save(''); };
  $('#aimform').onsubmit = function (ev) { ev.preventDefault(); var v = $('#aimdate').value; if (!v) { $('#aimdate').focus(); return; } save(v); };
}

// Add a resource: a link, class sbobine or slides, a file from your Google Drive, or a file uploaded to your Drive
function openAddRes(scope, mode) {
  var d = $('#repdlg'), course = /^course:/.test(scope), l = course ? null : byId[scope];
  if (!d) return;
  var title = course ? (COURSES.filter(function (c) { return 'course:' + c.code === scope; })[0] || {}).name : lecTitle(l);
  var groups = S.diary.groups || [];
  var close = function () { if (d.close) d.close(); else d.removeAttribute('open'); };
  var head = '<h2 id="rep-h" style="margin:0 0 4px;font-size:22px;font-weight:900">Add a resource</h2>' +
    '<p style="margin:0 0 4px;font-size:14px;line-height:1.45;color:#3C4043">To ' + h(title) + (course ? ', for the whole course' : '') + '.</p>';
  if (!mode) {
    var opt = function (m, t, sub) { return '<button type="button" class="ropt" data-rmode="' + m + '"><b>' + t + '</b><span>' + sub + '</span></button>'; };
    d.innerHTML = '<div>' + head + '<div class="ropts">' +
      opt('link', 'Paste a link', 'Any web page, video or file link') +
      opt('class', 'Add class sbobine or slides', l && l.files.length ? 'This lecture has ' + l.files.length + ' ' + pl(l.files.length, 'file', 'files') : 'From this lecture or any other') +
      opt('pick', 'Pick from my Google Drive', DRIVE_READY() ? 'Choose a file you already have' : 'Not switched on yet') +
      opt('upload', 'Upload from this device to my Google Drive', 'The file goes into your own Drive, only you can open it') +
      '</div><div style="margin-top:14px"><button type="button" class="sbtn2 soft" id="rno">Cancel</button></div></div>';
    if (d.showModal && !d.open) d.showModal(); else d.setAttribute('open', '');
    $('#rno').onclick = close;
    $$('[data-rmode]', d).forEach(function (b) { b.onclick = function () { openAddRes(scope, b.getAttribute('data-rmode')); }; });
    return;
  }
  var pane = '', who = '<fieldset style="border:0;padding:0;margin:14px 0 0"><legend style="font-size:14px;font-weight:800;padding:0">Who sees it</legend>' +
    (groups.length ? '<p style="margin:4px 0 0;font-size:13px;color:#5F6368">Only you, unless you tick a group.</p>' + groups.map(function (g) { return '<label class="check" style="margin-top:4px"><input type="checkbox" data-rgroup="' + h(g.id) + '"><span aria-hidden="true" class="bx">✓</span>Share with ' + h(g.name) + '</label>'; }).join('')
      : '<p style="margin:4px 0 0;font-size:13px;color:#5F6368">Only you. Join or make a study group to share resources.</p>') + '</fieldset>';
  var picked = [];
  if (mode === 'link') {
    pane = '<label class="fld" style="margin-top:14px">Link<input class="inp" id="rurl" type="url" inputmode="url" placeholder="https://…" autocomplete="off"></label>' +
      '<label class="fld" style="margin-top:10px">Name <span class="opt">Optional</span><input class="inp" id="rtitle" maxlength="120" placeholder="e.g. Amboss: cirrhosis" autocomplete="off"></label>';
  } else if (mode === 'class') {
    var withFiles = S.data.lectures.filter(function (x) { return x.files.length && !x.removed && (!course || 'course:' + x.cc === scope); });
    var first = l && l.files.length ? l.id : (withFiles[0] || {}).id || '';
    pane = withFiles.length ? '<label class="fld" style="margin-top:14px">From<select class="inp" id="rlec">' + withFiles.map(function (x) { return '<option value="' + h(x.id) + '"' + (x.id === first ? ' selected' : '') + '>' + h(lecTitle(x) + (l && x.id === l.id ? ' (this lecture)' : '') + ', ' + dayLabel_(x.date)) + '</option>'; }).join('') + '</select></label><div id="rfiles"></div>'
      : '<p style="margin:14px 0 0;font-size:14px;color:#5F6368">No sbobine or slides have been uploaded' + (course ? ' for this course' : '') + ' yet.</p>';
  } else if (mode === 'pick') {
    pane = DRIVE_READY() ? '<div style="margin-top:14px"><button type="button" class="btn2" id="rpick">Choose from my Google Drive</button></div><div id="rpicked"></div>'
      : '<p style="margin:14px 0 0;font-size:14px;line-height:1.45;color:#5F6368">Picking from Google Drive isn\'t switched on yet: an admin needs to finish one setup step in Google Cloud. Paste the file\'s link for now (Share, then Copy link in Drive).</p>';
  } else if (mode === 'upload') {
    pane = '<label class="fld" style="margin-top:14px">File <span class="opt">Up to 1 GB</span><input class="inp" id="rfile" type="file" style="padding:8px 10px;height:auto"></label>' +
      '<p style="margin:8px 0 0;font-size:13px;line-height:1.45;color:#5F6368">It\'s saved in a folder called "IMS Study Tracker" in your own Google Drive. Google asks once to let this site add files there; it can only see files it adds or you pick.</p><div class="progress" id="rprog" hidden><div class="bar"><i></i></div><div class="lbl"></div></div>';
  }
  d.innerHTML = '<form id="resform">' + head + pane + (mode === 'pick' && !DRIVE_READY() ? '' : who) +
    '<div id="rerr"></div><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px">' + (mode === 'pick' && !DRIVE_READY() ? '' : '<button class="sbtn" id="rgo">Add</button>') +
    '<button type="button" class="sbtn2" id="rback">Back</button><button type="button" class="sbtn2 soft" id="rno">Cancel</button></div></form>';
  if (d.showModal && !d.open) d.showModal(); else d.setAttribute('open', '');
  $('#rno').onclick = close;
  $('#rback').onclick = function () { openAddRes(scope); };
  var err = function (m) { $('#rerr').innerHTML = m ? '<div class="err-box drop" role="alert">' + h(m) + '</div>' : ''; };
  var drawFiles = function () {
    var x = byId[($('#rlec') || {}).value], have = S.diary.res.filter(function (r) { return r.scope === scope; }).map(function (r) { return r.url; });
    if (!x) return;
    $('#rfiles').innerHTML = '<fieldset style="border:0;padding:0;margin:10px 0 0"><legend class="sr">Files</legend>' + x.files.map(function (f, i) {
      var had = have.indexOf(f.u) >= 0;
      return '<label class="check" style="margin-top:4px"><input type="checkbox" data-rfile="' + i + '"' + (had ? ' disabled' : '') + '><span aria-hidden="true" class="bx">✓</span>' + h(f.l) + (had ? ' <span style="color:#80868B;font-weight:500">(already in your diary)</span>' : '') + '</label>';
    }).join('') + '</fieldset>';
  };

  if ($('#rpick')) $('#rpick').onclick = function () {
    err('');

    if (d.close) d.close(); else d.removeAttribute('open');

      back();

      if (picked.length) $('#rpick').textContent = 'Choose different files';
    }, function (x) { back(); err(x.message); });
  };
  $('#resform').onsubmit = function (ev) {

  var t = Math.max(6, r.t - pad), b = Math.min(ph ? H - ch - 22 : H - 6, r.b + pad), l = Math.max(4, r.l - pad), rr = Math.min(W - 4, r.r + pad);
  if (b < t + 40) b = t + 40;

  spot.style.top = t + 'px'; spot.style.left = l + 'px'; spot.style.width = (rr - l) + 'px'; spot.style.height = (b - t) + 'px';
  if (ph) return;
  var clamp = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }, top = null, left = null;

function tourClick(e) {
